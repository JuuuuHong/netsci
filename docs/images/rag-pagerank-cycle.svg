<text x="378.0" y="247" font-size="12" text-anchor="middle" class="m" fill="#57606a">(275회 · 3위 0.136)</text>
<text x="378.0" y="269" font-size="12" text-anchor="middle" fill="#cf222e">나가는 간선 1개</text>
