<rect width="900" height="480" fill="#ffffff"/>
<text x="30" y="40" font-size="20" font-weight="700">RAG 코퍼스(964편) — 인용 8회인 DPR 이 PageRank 1위인 이유</text>
<text x="30" y="66" font-size="13" fill="#57606a">화살표 A → B = A 가 B 를 인용. 코퍼스 안의 간선만 표시. 괄호: 코퍼스 내 피인용 수 · PageRank 순위와 값</text>
