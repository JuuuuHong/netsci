[workspace]
resolver = "3"
# 글롭(`crates/*`) 이 아니라 이름을 적는다. Cargo 의 글롭은 점으로 시작하는 디렉터리도 매치해서,
# 개발 도구가 만든 `crates/.omc/` 를 워크스페이스 멤버로 보고 `failed to load manifest for
# workspace member .../crates/.omc` 로 빌드 전체를 멈춘다.
# 대가: 새 크레이트를 여기 적지 않으면 에러 없이 조용히 빌드·clippy·test 대상에서 빠진다.
# 크레이트를 더할 때는 이 목록을 함께 고친다.
members = ["crates/netsci", "crates/netsci-report", "crates/netsci-report-derive"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "macros", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
